[package]
name = "pse"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.47", features = ["derive", "env"] }
gcloud-gax = "1.3.2"
gcloud-pubsub = {version = "1.6.0"}
tokio = { version = "1.47.1", features = ["rt", "macros"] }


[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false
