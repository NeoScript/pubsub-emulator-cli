<!DOCTYPE html>
<html lang="en" data-theme="dark" id="html-root">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PubSub Emulator{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/htmx.min.js"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="min-h-screen bg-base-200">

  <div class="navbar bg-base-100 shadow-lg px-4 border-b border-base-300">
    <div class="flex-1 gap-3">
      <a href="/" class="flex items-center gap-2 group">
        <div class="w-7 h-7 rounded-lg bg-primary flex items-center justify-center text-primary-content font-bold text-xs shrink-0">
          PS
        </div>
        <span class="font-bold text-base tracking-tight group-hover:text-primary transition-colors">pse</span>
      </a>
      <div class="divider divider-horizontal mx-0 h-5 self-center"></div>
      <span class="text-base-content/40 text-sm">PubSub Emulator</span>
    </div>

    <div class="flex-none gap-1">
      <!-- Theme toggle -->
      <label class="swap swap-rotate btn btn-ghost btn-sm btn-circle" title="Toggle theme">
        <input type="checkbox" id="theme-toggle" onchange="
          const html = document.getElementById('html-root');
          html.setAttribute('data-theme', this.checked ? 'light' : 'dark');
        ">
        <!-- Sun icon (shown in dark mode) -->
        <svg class="swap-off fill-current w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7,5,6.34A1,1,0,0,0,3.56,7.76L4.27,8.46A1,1,0,0,0,5.64,7Zm12,.71.71-.71A1,1,0,0,0,16.93,5.64l-.71.71A1,1,0,1,0,17.66,7.66ZM19,11H18a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-2,6a1,1,0,0,0-1.41,1.41l.71.71a1,1,0,0,0,1.41-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"/>
        </svg>
        <!-- Moon icon (shown in light mode) -->
        <svg class="swap-on fill-current w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"/>
        </svg>
      </label>

      <button class="btn btn-ghost btn-sm gap-2"
              hx-get="/settings"
              hx-target="#modal-container"
              hx-swap="innerHTML">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        Settings
      </button>
    </div>
  </div>

  <main class="{% block main_class %}container mx-auto p-6{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <div id="modal-container"></div>
  <div id="toast-container" class="toast toast-end z-50"></div>

</body>
</html>
