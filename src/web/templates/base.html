<!DOCTYPE html>
<html lang="en" data-theme="dark" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PubSub Emulator{% endblock %}</title>
  <link rel="icon" type="image/png" href="/static/icon.png">
  <!-- Apply saved theme before CSS loads to prevent flash -->
  <script>const t=localStorage.getItem('pse-theme');if(t)document.documentElement.setAttribute('data-theme',t);</script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/daisyui.css" rel="stylesheet" type="text/css">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="/static/htmx.min.js"></script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="h-full flex flex-col bg-base-200">

  <div class="navbar bg-base-100 shadow-lg px-4 border-b border-base-300 shrink-0">
    <div class="flex-1 flex items-center gap-3">
      <a href="/" class="flex items-center gap-2 group">
        <img src="/static/icon.png" alt="pse logo" class="w-7 h-7 object-contain shrink-0">
        <span class="font-bold text-base tracking-tight group-hover:text-primary transition-colors">pse</span>
      </a>
      <div class="divider divider-horizontal mx-0 h-5 self-center"></div>
      <span class="text-base-content text-sm">PubSub Emulator</span>
    </div>

    <div class="flex-none gap-1 items-center">
      <label class="flex cursor-pointer gap-2 items-center" title="Toggle theme">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
        </svg>
        <input type="checkbox" value="cupcake" id="theme-toggle" class="toggle theme-controller"
               onchange="localStorage.setItem('pse-theme', this.checked ? 'cupcake' : 'dark')" />
        <script>document.getElementById('theme-toggle').checked = localStorage.getItem('pse-theme') === 'cupcake';</script>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
      </label>
    </div>
  </div>

  <main class="flex-1 overflow-hidden flex flex-col {% block main_class %}container mx-auto p-6{% endblock %}">
    {% block content %}{% endblock %}
  </main>

  <div id="toast-container" class="fixed bottom-4 right-4 z-[9999] flex flex-col gap-2 items-end pointer-events-none"></div>

</body>
</html>
