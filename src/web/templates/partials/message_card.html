<div class="card bg-base-100 shadow-sm border border-base-300" id="msg-{{ message_id }}">
  <div class="card-body p-4 gap-3">

    <!-- Message header: ID + timestamp + ack -->
    <div class="flex items-start justify-between gap-3">
      <div class="flex flex-wrap items-center gap-2 min-w-0">
        <code class="text-xs font-mono bg-primary/10 text-primary px-2 py-0.5 rounded font-semibold truncate max-w-xs">
          {{ message_id }}
        </code>
        {% if publish_time %}
        <span class="flex items-center gap-1 text-xs text-base-content/40">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          {{ publish_time }}
        </span>
        {% endif %}
      </div>
      <form hx-post="/projects/{{ project }}/subscriptions/{{ subscription }}/ack"
            hx-target="#msg-{{ message_id }}"
            hx-swap="delete"
            class="shrink-0">
        <input type="hidden" name="ack_id" value="{{ ack_id }}">
        <button type="submit"
                class="btn btn-success btn-xs gap-1"
                title="Acknowledge message">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
          </svg>
          ACK
        </button>
      </form>
    </div>

    <!-- Payload -->
    <div>
      <p class="text-xs text-base-content/40 uppercase tracking-wider mb-1">Payload</p>
      <pre class="bg-base-300 rounded-lg p-3 text-sm font-mono overflow-x-auto whitespace-pre-wrap break-all leading-relaxed">{{ data }}</pre>
    </div>

    <!-- Attributes -->
    {% if attributes | length > 0 %}
    <div>
      <p class="text-xs text-base-content/40 uppercase tracking-wider mb-1.5">Attributes</p>
      <dl class="grid grid-cols-[auto_1fr] gap-x-4 gap-y-1">
        {% for key, value in attributes %}
        <dt class="font-mono text-xs text-base-content/60 self-start pt-0.5">{{ key }}</dt>
        <dd class="font-mono text-xs text-base-content truncate">{{ value }}</dd>
        {% endfor %}
      </dl>
    </div>
    {% endif %}

  </div>
</div>
