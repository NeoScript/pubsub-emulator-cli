<div class="alert {{ 'alert-error' if is_error else 'alert-success' }} shadow-lg flex items-start gap-2 toast-item w-80 max-w-sm pointer-events-auto"
     {% if is_error %}data-error="1"{% endif %}>
  {% if is_error %}
  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126z"/>
  </svg>
  {% else %}
  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
  </svg>
  {% endif %}
  <span class="text-sm flex-1 break-words">{{ message }}</span>
  <button class="btn btn-ghost btn-xs shrink-0 opacity-60 hover:opacity-100 -mt-0.5 -mr-1"
          onclick="this.closest('.toast-item').remove()"
          title="Dismiss">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </button>
</div>
<script>
  (function() {
    var items = document.querySelectorAll('#toast-container .toast-item');
    var el = items[items.length - 1];
    if (el && !el.dataset.error) {
      setTimeout(function() {
        el.style.transition = 'opacity 0.3s ease';
        el.style.opacity = '0';
        setTimeout(function() { if (el.parentNode) el.remove(); }, 300);
      }, 4000);
    }
  })();
</script>
