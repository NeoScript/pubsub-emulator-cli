{% if error %}
<div class="alert alert-error mx-2 mb-2 py-2 text-sm">
  <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126z"/>
  </svg>
  <span>{{ error }}</span>
</div>
{% endif %}

<ul class="menu menu-sm p-0 gap-0.5">

  {% if topics is defined and topics | length == 0 and not error %}
  <li class="pointer-events-none select-none">
    <span class="text-xs text-base-content/30 italic px-3 py-2">No topics yet</span>
  </li>
  {% endif %}

  {% for topic in topics %}
  <li>
    <a class="topic-item flex items-center justify-between rounded-lg px-3 py-2 group"
       hx-get="/projects/{{ project }}/topics/{{ topic }}/detail"
       hx-target="#detail-panel"
       hx-swap="innerHTML"
       hx-on::after-request="document.querySelectorAll('.topic-item').forEach(el => el.classList.remove('active')); this.classList.add('active');">
      <span class="truncate font-mono text-xs font-medium">{{ topic }}</span>
      <button class="btn btn-ghost btn-xs opacity-0 group-hover:opacity-100 text-error shrink-0 h-5 min-h-0 px-1"
              hx-delete="/projects/{{ project }}/topics/{{ topic }}/delete"
              hx-target="#topic-list"
              hx-swap="innerHTML"
              hx-confirm="Delete topic '{{ topic }}'?"
              onclick="event.preventDefault(); event.stopPropagation();"
              title="Delete topic">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </a>
  </li>
  {% endfor %}

  <!-- Add topic row — styled as a list item -->
  <li>
    <form hx-post="/projects/{{ project }}/topics"
          hx-target="#topic-list"
          hx-swap="innerHTML"
          hx-on::after-request="if(event.detail.successful){ this.reset(); this.querySelector('button[type=submit]').disabled=true; }"
          class="flex items-center gap-2 px-3 py-2 rounded-lg w-full cursor-text hover:bg-base-200/60"
          onclick="this.querySelector('input').focus()">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 shrink-0 text-base-content/25" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
      </svg>
      <input type="text"
             name="name"
             placeholder="New topic…"
             class="bg-transparent flex-1 text-xs font-mono outline-none min-w-0"
             oninput="this.closest('form').querySelector('button[type=submit]').disabled = !this.value.trim();"
             autocomplete="off"
             required>
      <button type="submit"
              disabled
              class="btn btn-ghost btn-xs shrink-0 px-1 opacity-0 transition-opacity"
              style="opacity: 0"
              title="Create topic">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/>
        </svg>
      </button>
    </form>
  </li>

</ul>
