<div class="flex flex-col gap-0 h-full">

  <!-- Topic header -->
  <div class="flex items-start justify-between mb-5">
    <div class="flex flex-col gap-1">
      <h2 class="text-xl font-bold">{{ topic }}</h2>
      <code class="text-xs text-base-content/40 font-mono bg-base-300 px-2 py-0.5 rounded">
        projects/{{ project }}/topics/{{ topic }}
      </code>
    </div>
  </div>

  <!-- Tabs -->
  <div role="tablist" class="tabs tabs-bordered mb-4">
    <input type="radio" name="topic_tabs_{{ topic }}" role="tab" class="tab" aria-label="Subscriptions" checked>
    <div role="tabpanel" class="tab-content pt-4 flex flex-col gap-4">

      <!-- Subscription list -->
      <div id="subscription-list"
           hx-get="/projects/{{ project }}/topics/{{ topic }}/subscriptions"
           hx-trigger="load"
           hx-swap="innerHTML">
        <div class="flex items-center gap-2 text-base-content/40">
          <span class="loading loading-spinner loading-sm"></span>
          <span class="text-sm">Loading subscriptions…</span>
        </div>
      </div>

    </div>

    <input type="radio" name="topic_tabs_{{ topic }}" role="tab" class="tab" aria-label="Publish">
    <div role="tabpanel" class="tab-content pt-4">

      <!-- Publish message form -->
      <div class="card bg-base-100 shadow-sm border border-base-300">
        <div class="card-body gap-4">
          <div class="flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/>
            </svg>
            <h3 class="font-semibold text-sm">Publish Message</h3>
          </div>

          <form id="publish-form-{{ topic }}"
                hx-post="/projects/{{ project }}/topics/{{ topic }}/publish"
                hx-target="#toast-container"
                hx-swap="innerHTML"
                hx-on::after-request="if(event.detail.successful) this.reset(); document.getElementById('attr-rows-{{ topic }}').innerHTML = attrRowTemplate();"
                class="flex flex-col gap-3">

            <div>
              <label class="label py-0 mb-1">
                <span class="label-text text-xs text-base-content/60 uppercase tracking-wider">Message body</span>
              </label>
              <textarea name="data"
                        placeholder="Message payload (plain text or JSON)…"
                        class="textarea textarea-bordered w-full font-mono text-sm leading-relaxed"
                        rows="5"
                        required></textarea>
            </div>

            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="label-text text-xs text-base-content/60 uppercase tracking-wider">Attributes</span>
                <button type="button"
                        class="btn btn-ghost btn-xs gap-1"
                        onclick="addAttrRow('{{ topic }}')">
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
                  </svg>
                  Add Attribute
                </button>
              </div>
              <div id="attr-rows-{{ topic }}" class="flex flex-col gap-1.5">
                <div class="attr-row grid grid-cols-2 gap-1.5">
                  <input type="text" name="attr_keys" placeholder="Key"
                         class="input input-bordered input-sm font-mono text-xs">
                  <input type="text" name="attr_values" placeholder="Value"
                         class="input input-bordered input-sm font-mono text-xs">
                </div>
              </div>
            </div>

            <div class="flex justify-end pt-1">
              <button type="submit" class="btn btn-primary btn-sm gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/>
                </svg>
                Publish
              </button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>

</div>

<!-- Attribute row helpers — CSP-safe, no eval -->
<template id="attr-row-tpl">
  <div class="attr-row grid grid-cols-2 gap-1.5">
    <input type="text" name="attr_keys" placeholder="Key"
           class="input input-bordered input-sm font-mono text-xs">
    <input type="text" name="attr_values" placeholder="Value"
           class="input input-bordered input-sm font-mono text-xs">
  </div>
</template>

<script>
  function attrRowTemplate() {
    return '<div class="attr-row grid grid-cols-2 gap-1.5">' +
      '<input type="text" name="attr_keys" placeholder="Key" class="input input-bordered input-sm font-mono text-xs">' +
      '<input type="text" name="attr_values" placeholder="Value" class="input input-bordered input-sm font-mono text-xs">' +
      '</div>';
  }
  function addAttrRow(topicId) {
    var tpl = document.getElementById('attr-row-tpl');
    var container = document.getElementById('attr-rows-' + topicId);
    if (tpl && container) {
      container.appendChild(tpl.content.cloneNode(true));
    }
  }
</script>
