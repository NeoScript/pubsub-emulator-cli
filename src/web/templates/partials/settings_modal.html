<dialog id="settings-modal" class="modal modal-open">
  <div class="modal-box max-w-2xl">

    <!-- Header -->
    <div class="flex items-center justify-between mb-5">
      <div>
        <h3 class="font-bold text-lg">Settings</h3>
        <p class="text-base-content/50 text-sm">Manage project → emulator host mappings.</p>
      </div>
      <button class="btn btn-sm btn-circle btn-ghost"
              onclick="document.getElementById('settings-modal').remove()"
              title="Close">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Projects table -->
    <div class="overflow-x-auto rounded-lg border border-base-300 mb-5">
      <table class="table table-sm">
        <thead>
          <tr class="bg-base-200 text-xs uppercase tracking-wider">
            <th class="text-base-content/50">Project ID</th>
            <th class="text-base-content/50">Emulator Host</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          {% for project_id, host in projects %}
          <tr class="hover">
            <td class="align-middle">
              <div class="flex items-center gap-2">
                <code class="font-mono text-sm">{{ project_id }}</code>
                {% if project_id == active_project %}
                <span class="badge badge-xs badge-primary">active</span>
                {% endif %}
              </div>
            </td>
            <td class="align-middle">
              <form hx-put="/settings"
                    hx-target="#toast-container"
                    hx-swap="innerHTML"
                    class="join">
                <input type="hidden" name="project" value="{{ project_id }}">
                <input type="text" name="host" value="{{ host }}"
                       class="input input-bordered input-xs join-item w-44 font-mono">
                <button type="submit" class="btn btn-xs btn-ghost join-item border border-base-300">
                  Save
                </button>
              </form>
            </td>
            <td class="align-middle text-right">
              <!-- Placeholder for future delete-project action -->
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <!-- Add project -->
    <div class="border-t border-base-300 pt-4">
      <p class="text-xs font-semibold uppercase tracking-wider text-base-content/50 mb-3">Add Project</p>
      <form hx-post="/projects"
            hx-target="#toast-container"
            hx-swap="innerHTML"
            class="flex gap-2">
        <div class="flex-1">
          <input type="text" name="project_id" placeholder="Project ID"
                 class="input input-bordered input-sm w-full font-mono" required>
        </div>
        <div class="flex-1">
          <input type="text" name="host" placeholder="localhost:8681"
                 class="input input-bordered input-sm w-full font-mono" value="localhost:8681">
        </div>
        <button type="submit" class="btn btn-primary btn-sm">Add</button>
      </form>
    </div>

    <div class="modal-action mt-4 pt-4 border-t border-base-300">
      <button class="btn btn-sm btn-ghost"
              onclick="document.getElementById('settings-modal').remove()">
        Close
      </button>
    </div>
  </div>

  <form method="dialog" class="modal-backdrop">
    <button onclick="document.getElementById('settings-modal').remove()">close</button>
  </form>
</dialog>
