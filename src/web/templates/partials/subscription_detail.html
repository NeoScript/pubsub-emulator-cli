<div class="flex flex-col gap-0 h-full">

  <!-- Subscription header with back nav -->
  <div class="flex items-start gap-3 mb-5">
    <button class="btn btn-ghost btn-sm btn-square mt-0.5 shrink-0"
            hx-get="/projects/{{ project }}/topics/{{ topic }}/detail"
            hx-target="#detail-panel"
            hx-swap="innerHTML"
            title="Back to topic">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
      </svg>
    </button>
    <div class="flex flex-col gap-1 min-w-0">
      <div class="flex items-center gap-2">
        <h2 class="text-xl font-bold truncate">{{ subscription }}</h2>
        <span class="badge badge-outline badge-sm shrink-0">pull</span>
      </div>
      <code class="text-xs text-base-content/40 font-mono bg-base-300 px-2 py-0.5 rounded truncate">
        projects/{{ project }}/subscriptions/{{ subscription }}
      </code>
      <p class="text-xs text-base-content/40 mt-0.5">
        Topic: <span class="font-mono">{{ topic }}</span>
      </p>
    </div>
  </div>

  <!-- Pull controls -->
  <div class="card bg-base-100 shadow-sm border border-base-300 mb-5">
    <div class="card-body p-4 gap-3">
      <div class="flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
        </svg>
        <h3 class="font-semibold text-sm">Pull Messages</h3>
      </div>
      <form hx-post="/projects/{{ project }}/subscriptions/{{ subscription }}/pull"
            hx-target="#pulled-messages"
            hx-swap="innerHTML"
            hx-indicator="#pull-spinner"
            class="flex items-end gap-3">
        <div>
          <label class="label py-0 mb-1">
            <span class="label-text text-xs text-base-content/60 uppercase tracking-wider">Max messages</span>
          </label>
          <input type="number" name="max_messages" value="10" min="1" max="100"
                 class="input input-bordered input-sm w-24 font-mono">
        </div>
        <div>
          <label class="label py-0 mb-1">
            <span class="label-text text-xs text-base-content/60 uppercase tracking-wider">Timeout (s)</span>
          </label>
          <input type="number" name="timeout_secs" value="10" min="1" max="60"
                 class="input input-bordered input-sm w-20 font-mono">
        </div>
        <button type="submit" class="btn btn-primary btn-sm gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
          </svg>
          Pull
          <span id="pull-spinner" class="loading loading-spinner loading-xs htmx-indicator"></span>
        </button>
      </form>
    </div>
  </div>

  <!-- Pulled messages area -->
  <div id="pulled-messages">
    <div class="flex flex-col items-center gap-2 py-8 text-center">
      <div class="w-10 h-10 rounded-full bg-base-100 flex items-center justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-base-content/30" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.625 12a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H8.25m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0H12m4.125 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm0 0h-.375M21 12c0 4.556-4.03 8.25-9 8.25a9.764 9.764 0 01-2.555-.337A5.972 5.972 0 015.41 20.97a5.969 5.969 0 01-.474-.065 4.48 4.48 0 00.978-2.025c.09-.457-.133-.901-.467-1.226C3.93 16.178 3 14.189 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25z"/>
        </svg>
      </div>
      <p class="text-sm text-base-content/40">Click Pull to fetch messages from this subscription.</p>
    </div>
  </div>

</div>
